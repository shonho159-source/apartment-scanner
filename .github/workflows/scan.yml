name: apartment-scan

on:
  schedule:
    # נומינלית 05:20+16:20 UTC = 08:20+19:20 שעון ישראל (קיץ). ה-cron של GitHub
    # הוא best-effort ונוטה להתעכב 30-90 דק' — לכן מתוזמן מוקדם ובדקה לא עגולה,
    # כך שבפועל ההודעות נוחתות סביב 9:00 ו-20:00.
    - cron: '20 5,16 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # שחזור מצב הדה-דופ בין ריצות (cache, best-effort).
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data
          key: apartment-scan-data-${{ github.run_id }}
          restore-keys: apartment-scan-data-

      - name: Run pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
        run: node src/pipeline.js
